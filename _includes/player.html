{% if page.audio_id %}<section id="player-dialog" class="panel inline-player" aria-labelledby="player-title">{% else %}<dialog id="player-dialog" aria-labelledby="player-title">{% endif %}<div class="modal-top"><span class="eyebrow">LISTEN · SHADOW · SPEAK</span><button {% if page.audio_id %}hidden{% endif %} id="close-player" class="icon-button" aria-label="关闭跟读播放器">✕</button></div><h2 id="player-title"></h2><p id="player-source" class="muted"></p><audio id="audio" controls preload="metadata"></audio><div class="player-tools"><label>语速 <select id="speed"><option value="0.6">0.6×</option><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.2">1.2×</option></select></label><label>模式 <select id="mode"><option value="listen">连续听读</option><option value="loop">选段循环</option><option value="shadow">留白跟读</option></select></label></div><div class="ab-controls"><label>A 起点（秒）<input id="point-a" type="number" min="0" step="0.1" value="0"></label><button id="set-a">设为当前</button><label>B 终点（秒）<input id="point-b" type="number" min="0" step="0.1" value="5"></label><button id="set-b">设为当前</button><button id="play-range" class="button">▶ 开始选段</button><button id="stop-range">停止跟读</button></div><p id="player-status" role="status">先听原音，再跟着模仿发音和节奏。</p><div id="transcript"></div><div class="record-panel"><strong>听听自己的声音</strong><p>戴上耳机，录下你的跟读，再和原音比较。录音仅留在当前页面。</p><button id="record">● 开始录音</button><audio id="recording" controls hidden></audio><a id="download-recording" hidden>保存录音</a><p id="record-status" role="status"></p></div><button id="complete-audio" class="button">✓ 我完成了这次练习</button>{% if page.audio_id %}</section>{% else %}</dialog>{% endif %}
